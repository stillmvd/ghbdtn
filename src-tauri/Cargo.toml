[workspace]
members = ["core", "layoutdll"]
default-members = ["core", "layoutdll", "."]
resolver = "2"

[package]
name = "ghbdtn"
version = "0.3.1"
description = "Исправляет раскладку и опечатки на лету"
authors = ["stillmvd"]
edition = "2021"

[lib]
name = "ghbdtn_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.dev]
debug = "line-tables-only"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ghbdtn-core = { path = "core" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2.13"
tauri-plugin-ship = { git = "https://github.com/stillmvd/tauri-ship", tag = "v0.1.1" }
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_GdiPlus",
    "Win32_Media_Audio",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
